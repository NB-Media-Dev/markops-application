<!-- EDIT LEAD MODAL (Creator Only) -->
@if (isOpen && lead) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-squircle-icon">
            <span class="material-symbols-outlined">edit</span>
          </div>
          <div>
            <h2>Edit Lead Details</h2>
            <p class="modal-sub">
              Created by {{ lead.creatorName || 'You' }} &bull; Only the creator can modify this lead
            </p>
          </div>
        </div>
        <button
          class="btn-close-modal"
          (click)="onClose()"
          aria-label="Close"
          type="button"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        @if (editLeadError) {
          <div class="form-alert-error">
            {{ editLeadError }}
          </div>
        }
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">First Name <span class="required">*</span></label>
            <input
              type="text"
              [ngModel]="editFirstName"
              (ngModelChange)="editFirstNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Rahul"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label">Last Name</label>
            <input
              type="text"
              [ngModel]="editLastName"
              (ngModelChange)="editLastNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Sharma"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Phone Number <span class="required">*</span></label>
            <input
              type="text"
              [ngModel]="editPhone"
              (ngModelChange)="editPhoneChange.emit($event)"
              class="form-input"
              placeholder="+91 9876543210"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              [ngModel]="editEmail"
              (ngModelChange)="editEmailChange.emit($event)"
              class="form-input"
              placeholder="user@example.com"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Lead Source</label>
            <input
              type="text"
              [ngModel]="editSource"
              (ngModelChange)="editSourceChange.emit($event)"
              class="form-input"
              placeholder="e.g. Digital Ads, Facebook"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label">Campaign Name</label>
            <input
              type="text"
              [ngModel]="editCampaignName"
              (ngModelChange)="editCampaignNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Careermate Intake"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Current Pipeline Status</label>
            <select [ngModel]="editStatus" (ngModelChange)="editStatusChange.emit($event)" class="form-input">
              <option value="NEW">NEW</option>
              <option value="ASSIGNED">ASSIGNED</option>
              <option value="CONTACTED">CONTACTED</option>
              <option value="FOLLOW_UP">FOLLOW UP</option>
              <option value="INTERESTED">INTERESTED</option>
              <option value="NOT_INTERESTED">NOT INTERESTED</option>
              <option value="PAID">PAID</option>
              <option value="WRONG_NUMBER">WRONG NUMBER</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label class="form-label">Assigned Telecaller</label>
            <select [ngModel]="editAssignedTo" (ngModelChange)="editAssignedToChange.emit($event)" class="form-input">
              <option value="">Unassigned</option>
              @for (user of realUsersList; track user.id) {
                <option [value]="user.id">
                  {{ user.fullName }}
                </option>
              }
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          class="btn-action-secondary"
          (click)="onClose()"
          [disabled]="isSavingEdit"
          type="button"
        >
          Cancel
        </button>
        <button
          class="btn-action-primary"
          (click)="onSave()"
          [disabled]="isSavingEdit"
          type="button"
        >
          @if (!isSavingEdit) {
            <span class="material-symbols-outlined fs-16">check</span>
          }
          <span>{{ isSavingEdit ? 'Saving...' : 'Save Changes' }}</span>
        </button>
      </div>
    </div>
  </div>
}
