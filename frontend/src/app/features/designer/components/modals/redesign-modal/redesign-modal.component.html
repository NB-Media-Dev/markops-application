@if (isOpen) {
  <div class="modal-backdrop redesign-modal-backdrop" (click)="onClose()">
    <div class="modal-box redesign-modal-box" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="modal-header redesign-modal-header">
        <div class="modal-title-group">
          <div class="modal-icon-badge redesign-icon-badge">
            <span class="material-symbols-outlined">rate_review</span>
          </div>
          <div>
            <div class="d-flex align-items-center gap-2">
              <h2 class="modal-title-text">Request Design Revision</h2>
              <span class="redesign-status-pill">Redesign Required</span>
            </div>
            <span class="modal-subtitle-text">
              Task: <strong>{{ task?.title || 'Design Task' }}</strong>
            </span>
          </div>
        </div>
        <button type="button" class="close-btn" (click)="onClose()" title="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body redesign-modal-body">
        <!-- Compact Designer Bar -->
        <div class="designer-compact-bar mb-2">
          <span class="material-symbols-outlined designer-compact-icon">brush</span>
          <span class="designer-compact-label">Assigned Designer:</span>
          <strong class="designer-compact-name">{{ getAssigneeName(task) }}</strong>
        </div>
        <!-- Quick Feedback Presets (One-click add) -->
        <div class="form-group mb-2">
          <label class="form-label-bold mb-1">Quick Suggestions (Click to Add):</label>
          <div class="redesign-chips-wrap">
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Fix brand color palette and contrast')"
            >
              <span class="material-symbols-outlined icon-xs">palette</span> Color & Contrast
            </button>
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Adjust logo padding, size and clear space')"
            >
              <span class="material-symbols-outlined icon-xs">branding_watermark</span> Logo &
              Branding
            </button>
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Improve layout margins and visual balance')"
            >
              <span class="material-symbols-outlined icon-xs">aspect_ratio</span> Spacing &
              Margins
            </button>
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Update typography and hierarchy')"
            >
              <span class="material-symbols-outlined icon-xs">text_fields</span> Typography
            </button>
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Provide high-resolution asset export')"
            >
              <span class="material-symbols-outlined icon-xs">high_quality</span> High-Res Quality
            </button>
            <button
              type="button"
              class="redesign-preset-chip"
              (click)="appendRedesignFeedback('Strictly follow requirement brief')"
            >
              <span class="material-symbols-outlined icon-xs">assignment</span> Follow Brief
            </button>
          </div>
        </div>
        <!-- Redesign Reason Textarea -->
        <div class="form-group mb-1">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label-bold mb-0" for="redesignInstructions">
              Revision Notes <span class="required-star">*</span>
            </label>
          </div>
          <textarea
            id="redesignInstructions"
            [value]="redesignReason()"
            (input)="redesignReason.set($any($event.target).value)"
            (keydown)="onRedesignKeyDown($event)"
            rows="3"
            placeholder="• Specify revision points for the designer..."
            class="form-control-modern textarea-modern redesign-textarea bullet-textarea"
            required
          ></textarea>
        </div>
      </div>
      <!-- Modal Footer -->
      <div class="modal-footer redesign-modal-footer">
        <div class="footer-left-note text-danger-subtle">
          <span class="material-symbols-outlined icon-2xs">info</span>
          <span>Returns task to In-Progress</span>
        </div>
        <div class="footer-btn-group">
          <button type="button" class="btn btn-ghost-modern" (click)="onClose()">
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-danger-gradient"
            [disabled]="!redesignReason().trim()"
            (click)="onSubmit()"
          >
            <span class="material-symbols-outlined icon-xs">rate_review</span>
            <span>Send Request</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
