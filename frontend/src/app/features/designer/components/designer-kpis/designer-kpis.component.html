<section class="kpi-grid">
  <div class="kpi-card card-designers card-purple">
    <div class="kpi-squircle-icon icon-purple">
      <span class="material-symbols-outlined">group</span>
    </div>
    <div class="kpi-info-cluster">
      <span class="kpi-title">Active Designers</span>
      <div class="kpi-value">{{ totalDesigners }}</div>
    </div>
  </div>
  <div class="kpi-card card-totaltasks card-amber">
    <div class="kpi-squircle-icon icon-amber">
      <span class="material-symbols-outlined">folder_open</span>
    </div>
    <div class="kpi-info-cluster">
      <span class="kpi-title">Total Assigned Tasks</span>
      <div class="kpi-value">{{ totalTasks }}</div>
    </div>
  </div>
  <div class="kpi-card card-pending card-blue">
    <div class="kpi-squircle-icon icon-blue">
      <span class="material-symbols-outlined">pending_actions</span>
    </div>
    <div class="kpi-info-cluster">
      <span class="kpi-title">Pending & In-Progress</span>
      <div class="kpi-value">{{ totalPending }}</div>
    </div>
  </div>
  <div class="kpi-card card-completed card-emerald">
    <div class="kpi-squircle-icon icon-emerald">
      <span class="material-symbols-outlined">task_alt</span>
    </div>
    <div class="kpi-info-cluster">
      <span class="kpi-title">Completed Creatives</span>
      <div class="kpi-value">{{ totalCompleted }}</div>
    </div>
  </div>
</section>
